// Full shared gameplay generated for Java8, with native1.16.5 lifecycle adapters.
def shared=new Properties(); file('../gradle.properties').withInputStream { shared.load(it) }
group=shared.getProperty('maven_group'); version=shared.getProperty('mod_version')
base { archivesName="simply_screens-${project.name}" }
ext.openuiPortVersion='0.0.15'; ext.packetweavePortVersion='0.1.4'
ext.portOpenuiJar=file(providers.gradleProperty('openuiJar').getOrElse("../../OpenUI-MC/${project.name}/build/libs/openui-mc-${project.name}-${openuiPortVersion}.jar"))
ext.portPacketweaveJar=file(providers.gradleProperty('packetweaveJar').getOrElse("../../PacketWeave/targets/${project.name}/build/libs/packetweave-${project.name}-${packetweavePortVersion}.jar"))
repositories { mavenCentral(); maven { url='https://maven.architectury.dev/' } }
java { toolchain.languageVersion=JavaLanguageVersion.of(17); withSourcesJar() }
sourceSets {
    packetweaveApi { java.srcDir providers.gradleProperty('packetweaveSource').getOrElse('../../PacketWeave/core/src/main/java') }
}
def generator=project.name.startsWith('forge')?'forge_1165_sources.py':'legacy_screen_sources.py'
def generateLegacySources=tasks.register('generateLegacySources', Exec) {
    ['../common/src/main/java','../common-1.20.1/src/main/java','../common-legacy/src/main/java','../common-1.16.5/src/main/java','src/main/java'].each { inputs.dir it }
    inputs.files '../tools/legacy_screen_sources.py','../tools/forge_1165_sources.py','../tools/forge_1165_types.json','../tools/java8_records.py'
    outputs.dir layout.buildDirectory.dir('generated/screens')
    commandLine 'python3',"../tools/${generator}",'--output',layout.buildDirectory.dir('generated/screens').get().asFile
}
if(project.name.startsWith('forge'))sourceSets.main.java.setSrcDirs([generateLegacySources])
else sourceSets.main.java.srcDir generateLegacySources

def generatePortResources=tasks.register('generatePortResources', Exec) {
    ['../common/src/main/resources','src/main/resources'].each { inputs.dir it }
    inputs.file '../tools/port_resources.py'
    outputs.dir layout.buildDirectory.dir('generated/portResources')
    commandLine 'python3','../tools/port_resources.py','--version','1.16.5','--loader',project.name.split('-')[0],'--output',layout.buildDirectory.dir('generated/portResources').get().asFile
}
sourceSets.main.resources.setSrcDirs([generatePortResources])
configurations { jabelAgent }
dependencies {
    compileOnly sourceSets.packetweaveApi.output
    testImplementation sourceSets.packetweaveApi.output
    compileOnly 'org.jetbrains:annotations:26.0.2'
    compileOnly 'org.projectlombok:lombok:1.18.42'
    annotationProcessor 'org.projectlombok:lombok:1.18.42'
    annotationProcessor 'com.github.bsideup.jabel:jabel-javac-plugin:0.4.2'
    jabelAgent 'net.bytebuddy:byte-buddy-agent:1.11.21'
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.withType(JavaCompile).configureEach {
    sourceCompatibility=JavaVersion.VERSION_17
    options.release=8
    options.encoding='UTF-8'
}
compileJava {
    dependsOn generateLegacySources
    options.fork=true
    doFirst { options.forkOptions.jvmArgs += "-javaagent:${configurations.jabelAgent.singleFile}".toString() }
}
compilePacketweaveApiJava { sourceCompatibility=JavaVersion.VERSION_1_8 }
sourcesJar { dependsOn generateLegacySources }
test { useJUnitPlatform(); javaLauncher=javaToolchains.launcherFor { languageVersion=JavaLanguageVersion.of(8) } }
processResources { duplicatesStrategy=DuplicatesStrategy.EXCLUDE; filesMatching(['fabric.mod.json','META-INF/mods.toml']) { expand version:project.version } }
tasks.register('verifyPortDependencies') {
    doLast { [portOpenuiJar,portPacketweaveJar].each { if(!it.isFile())throw new GradleException("Missing pinned standalone dependency: ${it}. See docs/requested-generations.md or pass -PopenuiJar/-PpacketweaveJar.") } }
}
compileJava { dependsOn 'verifyPortDependencies' }

def generateLegacyTests=tasks.register('generateLegacyTests',Exec) {
    ['../common/src/test/java','../common-legacy/src/test/java'].each { inputs.dir it }
    inputs.files '../tools/legacy_screen_tests.py','../tools/legacy_screen_sources.py','../tools/java8_records.py'
    outputs.dir layout.buildDirectory.dir('generated/tests')
    commandLine 'python3','../tools/legacy_screen_tests.py','--output',layout.buildDirectory.dir('generated/tests').get().asFile
}
sourceSets.test.java.srcDir generateLegacyTests
dependencies {
    testAnnotationProcessor 'com.github.bsideup.jabel:jabel-javac-plugin:0.4.2'
    testImplementation 'org.mockito:mockito-core:4.11.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:4.11.0'
}
compileTestJava {
    dependsOn generateLegacyTests
    options.fork=true
    doFirst { options.forkOptions.jvmArgs += "-javaagent:${configurations.jabelAgent.singleFile}".toString() }
}
