// Pure Java library - no Minecraft dependencies
// This module contains code shared across all Minecraft versions (1.20.1 and 1.21.1)

plugins {
    id 'java-library'
}

java {
    // Shared bytecode must run on the oldest supported Minecraft version.
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
    withSourcesJar()
}

// Use the same group and version as the parent project
group = rootProject.maven_group
version = rootProject.mod_version

base {
    archivesName = "$rootProject.archives_name-$project.name"
}

dependencies {
    // Lombok for code generation
    compileOnly "org.projectlombok:lombok:1.18.34"
    annotationProcessor "org.projectlombok:lombok:1.18.34"
    
    // SLF4J API for logging (implementation provided by Minecraft)
    compileOnly "org.slf4j:slf4j-api:2.0.9"
    
    // Test dependencies
    testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
    testImplementation "org.mockito:mockito-core:5.14.2"
    testImplementation "org.mockito:mockito-junit-jupiter:5.14.2"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.11.4"
    testImplementation "org.slf4j:slf4j-simple:2.0.9"
}

test {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
        showStandardStreams = true
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 17
}
