architectury {
    common rootProject.enabled_platforms.split(',')
}

// Add shadowBundle configuration for runtime dependencies to be bundled
configurations {
    shadowBundle
}

dependencies {
    // Depend on the shared common module
    implementation project(':common')

    // We depend on Fabric Loader here to use the Fabric @Environment annotations,
    // which get remapped to the correct annotations on each platform.
    // Do NOT use other classes from Fabric Loader.
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    // Architectury API. This is optional, and you can comment it out if you don't need it.
    modImplementation "dev.architectury:architectury:$rootProject.architectury_api_version"

    // Gson for JSON serialization
    implementation "com.google.code.gson:gson:2.8.9"

    // Lombok
    compileOnly "org.projectlombok:lombok:1.18.34"
    annotationProcessor "org.projectlombok:lombok:1.18.34"
    
    // Test dependencies
    testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
    testImplementation "org.mockito:mockito-core:5.14.2"
    testImplementation "org.mockito:mockito-junit-jupiter:5.14.2"
    testImplementation "org.slf4j:slf4j-simple:2.0.9"
}

test {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
        showStandardStreams = true
    }
}

// Configure processResources to include common resources directly
// Resources in common module are already in 1.21.1 format
processResources {
    from(project(':common').sourceSets.main.resources) {
        // Exclude the mixin JSON from common module - use version-specific one
        exclude 'simplyscreens.mixins.json'
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// Include :common classes in the jar so they're available at runtime
jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from {
        project(':common').sourceSets.main.output
    }
}
