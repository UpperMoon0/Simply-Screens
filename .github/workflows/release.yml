name: Build and Release Mod

on:
  push:
    branches: [main]
    paths:
      - gradle.properties

concurrency:
  group: release-workflow
  cancel-in-progress: false

jobs:
  version-change:
    name: Check mod version change
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.version.outputs.changed }}
      value: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compare mod_version with the previous revision
        id: version
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          read_version() {
            sed -n 's/^mod_version[[:space:]]*=[[:space:]]*//p' \
              | head -n1 | tr -d '\r' | xargs
          }

          current="$(read_version < gradle.properties)"
          [[ "$current" =~ ^[0-9A-Za-z][0-9A-Za-z._+-]*$ ]] \
            || { echo "Invalid mod_version: $current" >&2; exit 1; }

          changed=false
          if [[ -z "${BEFORE_SHA:-}" || "$BEFORE_SHA" =~ ^0+$ ]]; then
            changed=true
          else
            previous="$(git show "${BEFORE_SHA}:gradle.properties" | read_version)"
            [[ "$current" != "$previous" ]] && changed=true
            echo "mod_version: ${previous} -> ${current}"
          fi

          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "value=$current" >> "$GITHUB_OUTPUT"

  verify:
    needs: version-change
    if: needs.version-change.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout OpenUI-MC
        uses: actions/checkout@v4
        with:
          repository: UpperMoon0/OpenUI-MC
          # OpenUI 0.0.8, shared with Economy and Simply Speakers CI.
          ref: e91aa0bd2102391119459a4daa7e0a6d37754987
          path: OpenUI-MC
      - name: Verify OpenUI-MC version alignment
        shell: bash
        run: |
          set -euo pipefail
          expected="$(sed -n 's/^openui_version[[:space:]]*=[[:space:]]*//p' gradle.properties | head -n1 | tr -d '\r' | xargs)"
          actual="$(sed -n 's/^mod_version[[:space:]]*=[[:space:]]*//p' OpenUI-MC/gradle.properties | head -n1 | tr -d '\r' | xargs)"
          if [[ -z "$expected" || -z "$actual" || "$actual" != "$expected" ]]; then
            echo "OpenUI version mismatch: Simply Screens requires '$expected' but the checked-out source publishes '$actual'." >&2
            exit 1
          fi
      # OpenUI's Gradle build requires Java 21 even when publishing Java 17 artifacts.
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: gradle }
      # Every root Gradle invocation configures all loader modules, including
      # neoforge-26.1.2, so all five OpenUI artifacts must be installed.
      - name: Install matching OpenUI-MC artifacts
        run: |
          chmod +x gradlew OpenUI-MC/gradlew
          for target in \
            ":fabric-1.20.1:publishToMavenLocal" \
            ":forge-1.20.1:publishToMavenLocal" \
            ":fabric-1.21.1:publishToMavenLocal" \
            ":neoforge-1.21.1:publishToMavenLocal" \
            ":neoforge-26.1.2:publishToMavenLocal"; do
            JAVA_HOME=$JAVA_HOME_21_X64 ./gradlew -p OpenUI-MC "$target" --no-daemon
          done
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: gradle }
      - run: chmod +x gradlew
      - name: Run regression tests
        run: ./gradlew testAllVersions

  build:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { java: 21, version: '1.20.1', platform: fabric, project: fabric-1.20.1, pattern: 'simply_screens-fabric-1.20.1-*.jar' }
          - { java: 21, version: '1.20.1', platform: forge, project: forge-1.20.1, pattern: 'simply_screens-forge-1.20.1-*.jar' }
          - { java: 21, version: '1.21.1', platform: fabric, project: fabric-1.21.1, pattern: 'simply_screens-fabric-1.21.1-*.jar' }
          - { java: 21, version: '1.21.1', platform: neoforge, project: neoforge-1.21.1, pattern: 'simply_screens-neoforge-1.21.1-*.jar' }
          # Gradle 8.14 runs on Java 21 and downloads the Java 25 compile
          # toolchain through the Foojay resolver configured in settings.gradle.
          - { java: 21, version: '26.1.2', platform: neoforge, project: neoforge-26.1.2, pattern: 'simply_screens-neoforge-26.1.2-*.jar' }
    steps:
      - uses: actions/checkout@v4
      - name: Checkout OpenUI-MC
        uses: actions/checkout@v4
        with:
          repository: UpperMoon0/OpenUI-MC
          # OpenUI 0.0.8, shared with Economy and Simply Speakers CI.
          ref: e91aa0bd2102391119459a4daa7e0a6d37754987
          path: OpenUI-MC
      - name: Verify OpenUI-MC version alignment
        shell: bash
        run: |
          set -euo pipefail
          expected="$(sed -n 's/^openui_version[[:space:]]*=[[:space:]]*//p' gradle.properties | head -n1 | tr -d '\r' | xargs)"
          actual="$(sed -n 's/^mod_version[[:space:]]*=[[:space:]]*//p' OpenUI-MC/gradle.properties | head -n1 | tr -d '\r' | xargs)"
          if [[ -z "$expected" || -z "$actual" || "$actual" != "$expected" ]]; then
            echo "OpenUI version mismatch: Simply Screens requires '$expected' but the checked-out source publishes '$actual'." >&2
            exit 1
          fi
      # OpenUI's Gradle build requires Java 21 even when publishing Java 17 artifacts.
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: gradle }
      # Every root Gradle invocation configures all loader modules, including
      # neoforge-26.1.2, so all five OpenUI artifacts must be installed.
      - name: Install matching OpenUI-MC artifacts
        run: |
          chmod +x OpenUI-MC/gradlew
          for target in \
            ":fabric-1.20.1:publishToMavenLocal" \
            ":forge-1.20.1:publishToMavenLocal" \
            ":fabric-1.21.1:publishToMavenLocal" \
            ":neoforge-1.21.1:publishToMavenLocal" \
            ":neoforge-26.1.2:publishToMavenLocal"; do
            JAVA_HOME=$JAVA_HOME_21_X64 ./gradlew -p OpenUI-MC "$target" --no-daemon
          done
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '${{ matrix.java }}', cache: gradle }
      - run: chmod +x gradlew
      - run: ./gradlew :${{ matrix.project }}:build
      - uses: actions/upload-artifact@v4
        with:
          name: simply-screens-${{ matrix.platform }}-${{ matrix.version }}
          path: |
            ${{ matrix.project }}/build/libs/${{ matrix.pattern }}
            !${{ matrix.project }}/build/libs/*-sources.jar
            !${{ matrix.project }}/build/libs/*-dev-shadow.jar
          if-no-files-found: error

  publish-curseforge:
    name: Publish ${{ matrix.platform }} ${{ matrix.version }} to CurseForge
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { version: '1.20.1', platform: fabric, loader: Fabric, java_tag: 'Java 17' }
          - { version: '1.20.1', platform: forge, loader: Forge, java_tag: 'Java 17' }
          - { version: '1.21.1', platform: fabric, loader: Fabric, java_tag: 'Java 21' }
          - { version: '1.21.1', platform: neoforge, loader: NeoForge, java_tag: 'Java 21' }
          - { version: '26.1.2', platform: neoforge, loader: NeoForge, java_tag: 'Java 25' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: simply-screens-${{ matrix.platform }}-${{ matrix.version }}
          path: curseforge-artifact
      - name: Select release file
        id: release_file
        shell: bash
        run: |
          set -euo pipefail
          mod_version="$(sed -n 's/^mod_version[[:space:]]*=[[:space:]]*//p' gradle.properties | head -n 1 | tr -d '\r' | xargs)"
          [[ "$mod_version" =~ ^[0-9A-Za-z][0-9A-Za-z._+-]*$ ]] || { echo "Invalid mod_version: $mod_version" >&2; exit 1; }
          mapfile -t jars < <(find curseforge-artifact -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev-shadow.jar' | sort)
          [[ ${#jars[@]} -eq 1 ]] || { echo "Expected one runnable JAR; found ${#jars[@]}" >&2; exit 1; }
          printf 'mod_version=%s\njar_path=%s\n' "$mod_version" "${jars[0]}" >> "$GITHUB_OUTPUT"
      - name: Publish to CurseForge
        shell: bash
        env:
          CURSEFORGE_API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
          MOD_VERSION: ${{ steps.release_file.outputs.mod_version }}
          JAR_PATH: ${{ steps.release_file.outputs.jar_path }}
          MINECRAFT_VERSION: ${{ matrix.version }}
          PLATFORM: ${{ matrix.platform }}
          LOADER_NAME: ${{ matrix.loader }}
          JAVA_VERSION_NAME: ${{ matrix.java_tag }}
        run: |
          set -euo pipefail
          [[ -n "${CURSEFORGE_API_TOKEN:-}" ]] || { echo 'Missing required GitHub secret: CURSEFORGE_API_TOKEN' >&2; exit 1; }
          changelog_path="changelog/${MOD_VERSION}.md"
          [[ -f "$changelog_path" ]] || { echo "Missing release changelog: $changelog_path" >&2; exit 1; }
          if [[ "$PLATFORM" == fabric ]]; then
            relations='{"projects":[{"slug":"architectury-api","type":"requiredDependency"},{"slug":"fabric-api","type":"requiredDependency"},{"slug":"openui-mc","projectID":1661978,"type":"requiredDependency"}]}'
          else
            relations='{"projects":[{"slug":"architectury-api","type":"requiredDependency"},{"slug":"openui-mc","projectID":1661978,"type":"requiredDependency"}]}'
          fi
          tags="$(jq -cn --arg mc "$MINECRAFT_VERSION" --arg loader "$LOADER_NAME" --arg java "$JAVA_VERSION_NAME" '[$mc,$loader,$java,"Client","Server"]')"
          available="$(curl --fail-with-body --silent --show-error --header "X-Api-Token: $CURSEFORGE_API_TOKEN" https://minecraft.curseforge.com/api/game/versions)"
          while IFS= read -r tag; do jq -e --arg tag "$tag" 'any(.[]; .name == $tag)' <<< "$available" >/dev/null || { echo "Unknown CurseForge tag: $tag" >&2; exit 1; }; done < <(jq -r '.[]' <<< "$tags")
          metadata="$(jq -cn --rawfile changelog "$changelog_path" --arg name "Simply Screens ${MOD_VERSION} - ${LOADER_NAME} ${MINECRAFT_VERSION}" --argjson tags "$tags" --argjson relations "$relations" '{changelog:$changelog,changelogType:"markdown",displayName:$name,gameVersionNames:$tags,releaseType:"release",relations:$relations}')"
          response="$(curl --fail-with-body --silent --show-error --request POST --header "X-Api-Token: $CURSEFORGE_API_TOKEN" --form-string "metadata=$metadata" --form "file=@$JAR_PATH" https://minecraft.curseforge.com/api/projects/1188741/upload-file)"
          echo "Published $JAR_PATH as CurseForge file $(jq -er '.id' <<< "$response")."

  release:
    needs: [build, publish-curseforge]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - name: Read mod version
        id: version
        shell: bash
        run: |
          value="$(sed -n 's/^mod_version[[:space:]]*=[[:space:]]*//p' gradle.properties | head -n 1 | tr -d '\r' | xargs)"
          echo "value=$value" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          name: Simply Screens v${{ steps.version.outputs.value }}
          body_path: changelog/${{ steps.version.outputs.value }}.md
          draft: false
          prerelease: false
          files: artifacts/**/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
