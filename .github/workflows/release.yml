name: Release

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build 1.20.1 and 1.21.1
        run: ./gradlew build

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Build 26.1.2
        run: |
          chmod +x ./neoforge-26.1.2/gradlew
          ./neoforge-26.1.2/gradlew -p ./neoforge-26.1.2 build

      - name: Get version
        id: get_version
        run: |
           echo "version=$(grep 'mod_version' gradle.properties | head -1 | cut -d'=' -f2 | xargs)" >> $GITHUB_OUTPUT

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MOD_VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          set -euo pipefail

          tag="v${MOD_VERSION}"
          forge_1201="./forge-1.20.1/build/libs/simply_screens-forge-1.20.1-${MOD_VERSION}.jar"
          fabric_1201="./fabric-1.20.1/build/libs/simply_screens-fabric-1.20.1-${MOD_VERSION}.jar"
          neoforge_1211="./neoforge-1.21.1/build/libs/simply_screens-neoforge-1.21.1-${MOD_VERSION}.jar"
          fabric_1211="./fabric-1.21.1/build/libs/simply_screens-fabric-1.21.1-${MOD_VERSION}.jar"
          neoforge_2612="./neoforge-26.1.2/build/libs/simply_screens-neoforge-26.1.2-${MOD_VERSION}.jar"
          assets=("$forge_1201" "$fabric_1201" "$neoforge_1211" "$fabric_1211" "$neoforge_2612")

          for asset in "${assets[@]}"; do
            test -f "$asset"
          done

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            gh release create "$tag" "${assets[@]}" \
              --title "Simply Screens v${MOD_VERSION}" \
              --generate-notes
          fi
