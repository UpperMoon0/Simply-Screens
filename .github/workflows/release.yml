name: Release

on:
  push:
    branches:
      - main
      - release/1.20.1
      - release/1.20.4

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew build

      - name: Get version
        id: get_version
        run: |
           echo "version=$(grep 'mod_version' gradle.properties | cut -d'=' -f2 | xargs)" >> $GITHUB_OUTPUT
           echo "mc_version=$(grep 'minecraft_version' gradle.properties | cut -d'=' -f2 | xargs)" >> $GITHUB_OUTPUT

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MC_VERSION: ${{ steps.get_version.outputs.mc_version }}
          MOD_VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          set -euo pipefail

          tag="v${MC_VERSION}-${MOD_VERSION}"
          neoforge_jar="./neoforge-${MC_VERSION}/build/libs/simply_screens-neoforge-${MC_VERSION}-${MOD_VERSION}.jar"
          fabric_jar="./fabric-${MC_VERSION}/build/libs/simply_screens-fabric-${MC_VERSION}-${MOD_VERSION}.jar"

          test -f "$neoforge_jar"
          test -f "$fabric_jar"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$neoforge_jar" "$fabric_jar" --clobber
          else
            gh release create "$tag" "$neoforge_jar" "$fabric_jar" \
              --title "Simply Screens v${MC_VERSION}-${MOD_VERSION}" \
              --generate-notes
          fi
