name: Shader color regression

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: screen-shader-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
      targets: ${{ steps.matrix.outputs.targets }}
      java17: ${{ steps.java17.outputs.version }}
      java21: ${{ steps.java21.outputs.version }}
      java25: ${{ steps.java25.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/visual/requirements.txt
      # Resolve published builds once; separate hosted runners can cache different patches.
      # Finish on Java 17 for the existing harness fixtures before OpenUI switches to 21.
      - name: Resolve Java 25 toolchain
        id: java25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          check-latest: true
      - name: Resolve Java 21 toolchain
        id: java21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          check-latest: true
      - name: Resolve Java 17 toolchain
        id: java17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          check-latest: true
      - name: Verify harness and generate required target matrix
        id: matrix
        run: |
          python -m pip install -r tools/visual/requirements.txt
          python -m unittest discover -s tools -p 'test_*.py' -v
          python tools/render_contract.py
          echo "value=$(python tools/shader_test.py --matrix)" >> "$GITHUB_OUTPUT"
          echo "targets=$(python tools/visual_test.py --matrix)" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/openui
        with:
          java-version: ${{ steps.java21.outputs.version }}

  native-build:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix: ${{ fromJSON(needs.prepare.outputs.targets) }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/visual/requirements.txt
      - name: Set up standalone PacketWeave build JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.target == 'forge-1.20.1' && needs.prepare.outputs.java17 || needs.prepare.outputs.java25 }}
          cache: gradle
          cache-dependency-path: |
            vendor/PacketWeave/**/*.gradle*
            vendor/PacketWeave/**/gradle-wrapper.properties
            vendor/PacketWeave/**/gradle.properties
      - name: Record standalone PacketWeave toolchain
        run: python tools/ci_native_artifact.py toolchain --toolchain-file build/packet-toolchain.json
      - name: Build pinned standalone PacketWeave native mod
        working-directory: vendor/PacketWeave/targets/${{ matrix.target }}
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon --console=plain --max-workers=4 \
            --init-script "$GITHUB_WORKSPACE/tools/ci_packet_compiler.init.gradle" \
            -PciPacketCompilerReport="$GITHUB_WORKSPACE/build/packet-compiler.json"
      - uses: ./.github/actions/openui
        with:
          java-version: ${{ needs.prepare.outputs.java21 }}
      - name: Provide Minecraft 1.20.1 runtime JDK
        if: matrix.target == 'fabric-1.20.1'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ needs.prepare.outputs.java17 }}
      - name: Restore build JDK after runtime installation
        if: matrix.target == 'fabric-1.20.1'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ needs.prepare.outputs.java21 }}
      - name: Verify production artifact and package exact-source prerequisite
        run: python tools/ci_native_artifact.py create --target '${{ matrix.target }}' --package build/native-package --toolchain-file build/packet-toolchain.json
      - uses: actions/upload-artifact@v4
        with:
          name: shader-native-${{ matrix.target }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: build/native-package/
          if-no-files-found: error
      - name: Preserve failed production-test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: shader-production-test-diagnostics-${{ matrix.target }}
          path: |
            build/screen-production-work/**/build/test-results/**
            build/screen-production-work/**/build/reports/tests/**
          if-no-files-found: ignore

  shader:
    needs: [prepare, native-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      # At most one server/client pair per runner; no CPU/GPU contention between controls.
      max-parallel: 10
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/visual/requirements.txt
      - name: Set up standalone PacketWeave build JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.target == 'forge-1.20.1' && needs.prepare.outputs.java17 || needs.prepare.outputs.java25 }}
          cache: gradle
          cache-dependency-path: |
            vendor/PacketWeave/**/*.gradle*
            vendor/PacketWeave/**/gradle-wrapper.properties
            vendor/PacketWeave/**/gradle.properties
      - name: Record standalone PacketWeave toolchain
        run: python tools/ci_native_artifact.py toolchain --toolchain-file build/packet-toolchain.json
      - uses: ./.github/actions/openui
        with:
          java-version: ${{ needs.prepare.outputs.java21 }}
      - name: Provide Minecraft 1.20.1 runtime JDK
        if: matrix.target == 'fabric-1.20.1'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ needs.prepare.outputs.java17 }}
      - name: Restore build JDK after runtime installation
        if: matrix.target == 'fabric-1.20.1'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ needs.prepare.outputs.java21 }}
      - name: Install graphics and pixel analysis runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri
          python -m pip install -r tools/visual/requirements.txt
          chmod +x gradlew
      - name: Cache checksum-verified shader downloads
        id: shader-cache
        uses: actions/cache@v4
        with:
          path: build/shader-dependencies
          key: shader-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-${{ hashFiles('tools/shader/stack-lock.json') }}
      - name: Download this workflow's exact-target native prerequisite
        uses: actions/download-artifact@v4
        with:
          name: shader-native-${{ matrix.target }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: build/native-package
      - name: Verify source, target, toolchains and artifact digest before use
        run: python tools/ci_native_artifact.py consume --target '${{ matrix.target }}' --package build/native-package --toolchain-file build/packet-toolchain.json
      - name: Real Complementary source colors, original control, transparency and bloom
        env:
          LIBGL_ALWAYS_SOFTWARE: 'true'
          SHADER_DOWNLOAD_CACHE_HIT: ${{ steps.shader-cache.outputs.cache-hit }}
        run: |
          mkdir -p build/shader-evidence/${{ matrix.target }}
          /usr/bin/time -v -o build/shader-evidence/${{ matrix.target }}/resource-${{ matrix.shard }}.txt \
            python tools/shader_test.py --target '${{ matrix.target }}' --shard '${{ matrix.shard }}'
      - name: Preserve measurements, screenshots and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screen-shader-${{ matrix.target }}-${{ matrix.shard }}
          path: build/shader-evidence/${{ matrix.target }}/
          if-no-files-found: error

  required:
    name: Required shader color evidence
    if: always()
    needs: [prepare, native-build, shader]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: screen-shader-*
          path: evidence
      - name: Require every target and negative control at the exact head
        env:
          PREPARE: ${{ needs.prepare.result }}
          VISUAL: ${{ needs.shader.result }}
          NATIVE: ${{ needs.native-build.result }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$PREPARE" = success && test "$NATIVE" = success && test "$VISUAL" = success
          python3 tools/shader_test.py --verify-receipts evidence --head "$EXPECTED_HEAD"
