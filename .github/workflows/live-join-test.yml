name: Live client join test

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - "common/**"
      - "common-1.20.1/**"
      - "common-1.21.1/**"
      - "fabric-1.20.1/**"
      - "forge-1.20.1/**"
      - "fabric-1.21.1/**"
      - "neoforge-1.21.1/**"
      - "neoforge-26.1.2/**"
      - "tools/live_join_test.py"
      - "tools/assert_production_jar.py"
      - "tools/build_openui.py"
      - ".github/actions/openui/**"
      - ".github/workflows/live-join-test.yml"

permissions:
  contents: read

concurrency:
  group: live-join-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/openui

  live-join:
    needs: dependencies
    timeout-minutes: 25
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: fabric-1.20.1
          - target: forge-1.20.1
          - target: fabric-1.21.1
          - target: neoforge-1.21.1
          - target: neoforge-26.1.2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/openui
      - name: Install virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - run: chmod +x gradlew
      - name: Run automatic real-client join test
        run: python3 tools/live_join_test.py --target "${{ matrix.target }}"
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-join-${{ matrix.target }}
          path: |
            ${{ matrix.target }}/run/live-join/client/logs
            ${{ matrix.target }}/run/live-join/server/logs
            ${{ matrix.target }}/run/live-join/client/crash-reports
            ${{ matrix.target }}/run/live-join/server/crash-reports
          if-no-files-found: ignore
