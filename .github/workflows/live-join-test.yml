name: Live client join test

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - "common/**"
      - "common-1.20.1/**"
      - "common-1.21.1/**"
      - "fabric-1.20.1/**"
      - "forge-1.20.1/**"
      - "fabric-1.21.1/**"
      - "neoforge-1.21.1/**"
      - "neoforge-26.1.2/**"
      - "tools/live_join_test.py"
      - "tools/playlist_test.py"
      - "tools/test_playlist_test.py"
      - "tools/playlist/**"
      - "tools/assert_production_jar.py"
      - "tools/verify_packetweave_coinstallation.py"
      - "tools/PacketWeaveCoinstallation.java"
      - "tools/packetweave_runtime.py"
      - "packetweave-api/**"
      - "packetweave.gradle"
      - "vendor/PacketWeave"
      - "tools/build_openui.py"
      - ".github/actions/openui/**"
      - ".github/workflows/live-join-test.yml"

permissions:
  contents: read

concurrency:
  group: live-join-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/openui

  live-join:
    needs: dependencies
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: fabric-1.20.1
          - target: forge-1.20.1
          - target: fabric-1.21.1
          - target: neoforge-1.21.1
          - target: neoforge-26.1.2
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up standalone PacketWeave build JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.target == 'forge-1.20.1' && '17' || '25' }}
      - name: Build pinned standalone PacketWeave native mod
        working-directory: vendor/PacketWeave/targets/${{ matrix.target }}
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon --console=plain --max-workers=4
      - uses: ./.github/actions/openui
      - name: Install virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - run: chmod +x gradlew
      - name: Run automatic real-client join with standalone PacketWeave
        run: python3 tools/live_join_test.py --target "${{ matrix.target }}" --check-packetweave-dependency
      - name: Run synchronized playlist lifecycle and populated UI tests
        run: python3 tools/playlist_test.py --target "${{ matrix.target }}"
      - name: Upload playlist evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playlist-${{ matrix.target }}
          path: build/screen-playlist-evidence/**
          if-no-files-found: error
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-join-${{ matrix.target }}
          path: |
            ${{ matrix.target }}/build/test-results/**
            ${{ matrix.target }}/build/reports/tests/**
            ${{ matrix.target }}/run/live-join/dependency-checks
            ${{ matrix.target }}/run/live-join/client/logs
            ${{ matrix.target }}/run/live-join/server/logs
            ${{ matrix.target }}/run/live-join/client/crash-reports
            ${{ matrix.target }}/run/live-join/server/crash-reports
          if-no-files-found: ignore

  playlist-evidence:
    name: Required playlist lifecycle evidence
    if: always()
    needs: live-join
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: playlist-*
          path: playlist-evidence
      - name: Verify all five exact-head playlist receipts
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 tools/playlist_test.py --verify-receipts playlist-evidence --head "$EXPECTED_HEAD"
