name: PR Tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Source and harness contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Test verification harnesses
        # Pixel-oracle self-tests use synthetic images and never boot Minecraft.
        run: |
          python3 -m pip install -r tools/visual/requirements.txt
          python3 -m unittest discover -s tools -p 'test_*.py' -v
      - name: Verify screen render contract
        run: python3 tools/render_contract.py

  test:
    name: Run all tests
    needs: contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/openui
      - run: chmod +x gradlew
      - name: Run all version tests
        run: ./gradlew testAllVersions --no-daemon
      - name: Inspect compiled render submissions
        run: python3 tools/compiled_render_contract.py
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-test-diagnostics
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
          if-no-files-found: ignore
