name: Screen visual regression

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: screen-visual-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify harness and generate required target matrix
        id: matrix
        run: |
          python -m pip install -r tools/visual/requirements.txt
          python -m unittest discover -s tools -p 'test_*.py' -v
          python tools/render_contract.py
          echo "value=$(python tools/visual_test.py --matrix)" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/openui

  visual:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up standalone PacketWeave build JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.target == 'forge-1.20.1' && '17' || '25' }}
      - name: Build pinned standalone PacketWeave native mod
        working-directory: vendor/PacketWeave/targets/${{ matrix.target }}
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon --console=plain --max-workers=4
      - uses: ./.github/actions/openui
      - name: Install graphics and pixel analysis runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri
          python -m pip install -r tools/visual/requirements.txt
          chmod +x gradlew
      - name: Verify production artifact before test-only instrumentation
        run: python tools/verify_production_build.py --target '${{ matrix.target }}'
      - name: Fixed renderer and required negative controls
        env:
          LIBGL_ALWAYS_SOFTWARE: 'true'
        run: python tools/visual_test.py --target '${{ matrix.target }}'
      - name: Preserve failed production-test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: production-test-diagnostics-${{ matrix.target }}
          path: |
            build/screen-production-work/**/build/test-results/**
            build/screen-production-work/**/build/reports/tests/**
          if-no-files-found: ignore
      - name: Preserve measurements, screenshots and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screen-visual-${{ matrix.target }}
          path: build/screen-visual-evidence/${{ matrix.target }}/
          if-no-files-found: error

  required:
    name: Required screen visual evidence
    if: always()
    needs: [prepare, visual]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: screen-visual-*
          path: evidence
      - name: Require every target and negative control at the exact head
        env:
          PREPARE: ${{ needs.prepare.result }}
          VISUAL: ${{ needs.visual.result }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$PREPARE" = success && test "$VISUAL" = success
          python3 tools/visual_test.py --verify-receipts evidence --head "$EXPECTED_HEAD"
