name: Requested native generations
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: requested-generations-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: [forge-1.12.2, fabric-1.16.5, forge-1.16.5, fabric-26.2, neoforge-26.2]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive
          path: Simply-Screens
      - uses: actions/checkout@v4
        with:
          repository: UpperMoon0/PacketWeave
          ref: b9af8be1c8dae497a852342a0d323f811b80b54a
          path: PacketWeave
      - uses: actions/checkout@v4
        with:
          repository: UpperMoon0/OpenUI-MC
          ref: 672b5b2b7169bef30f5f10b34f296812abe31460
          path: OpenUI-MC
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            17
            21
            25
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
      - name: Select the native Gradle runner
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          case "$TARGET" in
            forge-1.12.2) home="$JAVA_HOME_8_X64" ;;
            forge-1.16.5) home="$JAVA_HOME_21_X64" ;;
            *) home="$JAVA_HOME_25_X64" ;;
          esac
          echo "JAVA_HOME=$home" >> "$GITHUB_ENV"
          echo "$home/bin" >> "$GITHUB_PATH"
          echo "JAVA17_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
      - name: Build pinned native dependency mods without release publishing
        env:
          TARGET: ${{ matrix.target }}
        run: |
          chmod +x PacketWeave/targets/$TARGET/gradlew OpenUI-MC/$TARGET/gradlew
          PacketWeave/targets/$TARGET/gradlew -p PacketWeave/targets/$TARGET build --no-daemon --max-workers=2 --stacktrace
          OpenUI-MC/$TARGET/gradlew -p OpenUI-MC/$TARGET build publishToMavenLocal --no-daemon --max-workers=2 --stacktrace
      - name: Build complete Screens native target and test its runtime contracts
        working-directory: Simply-Screens
        env:
          TARGET: ${{ matrix.target }}
        run: |
          chmod +x "$TARGET/gradlew"
          "$TARGET/gradlew" -p "$TARGET" build --no-daemon --max-workers=2 --stacktrace
          version=$(sed -n 's/^[[:space:]]*mod_version[[:space:]]*=[[:space:]]*//p' gradle.properties | tr -d '\r')
          test -n "$version"
          python3 tools/verify_requested_jar.py "$TARGET/build/libs/simply_screens-$TARGET-$version.jar" --target "$TARGET"
          python3 -m unittest discover -s tools -p 'test_requested*.py' -v
          python3 -m unittest discover -s tools -p test_modern_screen_sources.py -v
          python3 -m unittest discover -s tools -p test_forge_1122_sources.py -v
          python3 -m unittest discover -s tools -p test_legacy_media_probe.py -v
      - name: Prefetch official legacy assets with bounded transport retries
        if: matrix.target == 'forge-1.12.2'
        working-directory: Simply-Screens
        run: |
          mkdir -p build
          python3 tools/prefetch_legacy_asset_aliases.py --asset-root "${GRADLE_USER_HOME:-$HOME/.gradle}/caches/forge_gradle/assets"
          for attempt in 1 2 3; do
            if forge-1.12.2/gradlew -p forge-1.12.2 downloadAssets --no-daemon --max-workers=2 > build/legacy-assets.log 2>&1; then
              cat build/legacy-assets.log
              break
            fi
            cat build/legacy-assets.log
            if [ "$attempt" = 3 ] || ! grep -Eq 'SocketTimeoutException|Read timed out|Connection reset|HTTP response code: (429|5[0-9][0-9])' build/legacy-assets.log; then
              exit 1
            fi
            sleep 5
          done
      - name: Install headless native graphics runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11-xserver-utils libgl1-mesa-dri mesa-vulkan-drivers libvulkan1
      - name: Real dedicated-server join and OpenUI smoke test
        id: native_join
        working-directory: Simply-Screens
        env:
          TARGET: ${{ matrix.target }}
          LIBGL_ALWAYS_SOFTWARE: 'true'
        run: python3 tools/requested_live_join.py --target "$TARGET" --timeout 420
      - name: Check the separately permitted native Singleplayer boundary
        id: integrated_boundary
        if: always() && steps.native_join.outcome == 'failure' && (matrix.target == 'fabric-1.16.5' || matrix.target == 'forge-1.16.5')
        working-directory: Simply-Screens
        env:
          TARGET: ${{ matrix.target }}
        run: python3 tools/requested_integrated_acceptance.py --target "$TARGET" --check-boundary --github-output "$GITHUB_OUTPUT"
      - name: Separate ordinary Singleplayer UI and native media acceptance
        if: always() && steps.integrated_boundary.outputs.accepted == 'true'
        working-directory: Simply-Screens
        env:
          TARGET: ${{ matrix.target }}
          LIBGL_ALWAYS_SOFTWARE: 'true'
        run: python3 tools/requested_integrated_acceptance.py --target "$TARGET" --timeout 900
      - name: Calibrated native framebuffer acceptance and negative controls
        if: matrix.target == 'fabric-26.2'
        working-directory: Simply-Screens
        env:
          LIBGL_ALWAYS_SOFTWARE: 'true'
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 -m pip install -r tools/visual/requirements.txt
          python3 tools/requested_visual.py --target fabric-26.2
          mapfile -t receipts < <(find build/requested-visual-evidence/fabric-26.2 -name result.json -type f)
          test "${#receipts[@]}" = 1
          python3 tools/requested_visual.py --verify-receipt "${receipts[0]}" --head "$EXPECTED_HEAD"
      - name: Preserve exact-head build and runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: requested-${{ matrix.target }}
          path: |
            Simply-Screens/${{ matrix.target }}/build/reports/tests/**
            Simply-Screens/${{ matrix.target }}/build/test-results/**
            Simply-Screens/${{ matrix.target }}/build/libs/*.jar
            Simply-Screens/${{ matrix.target }}/run/live-join/**/logs/**
            Simply-Screens/${{ matrix.target }}/run/live-join/**/crash-reports/**
            Simply-Screens/build/requested-runtime/${{ matrix.target }}/**
            Simply-Screens/${{ matrix.target }}/run/integrated-acceptance/**/receipt.json
            Simply-Screens/${{ matrix.target }}/run/integrated-acceptance/**/integrated.log
            Simply-Screens/${{ matrix.target }}/run/integrated-acceptance/**/logs/**
            Simply-Screens/${{ matrix.target }}/run/integrated-acceptance/**/crash-reports/**
            Simply-Screens/build/requested-visual-evidence/${{ matrix.target }}/**
          if-no-files-found: warn
