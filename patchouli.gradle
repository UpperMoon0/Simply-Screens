// Resource-only optional integration; never package Patchouli or require its API.
// BookRegistry discovers definitions from each physical loader mod root.
if (!project.name.endsWith('26.1.2')) {
    processResources {
        from('../common/src/main/resources/data/simply_screens/patchouli_books') {
            into 'data/simply_screens/patchouli_books'
            if (project.name.endsWith('1.20.1')) {
                filter { line -> line.replace('"model": "simply_screens:guide_book"', '"model": "simply_screens:item/guide_book"') }
            }
        }
    }
}
// Development runtime toggle; enabled by the project defaults, optional in production metadata.
if (providers.gradleProperty('screensPatchouli').map { it.toBoolean() }.getOrElse(true)) {
    repositories { maven { url = 'https://maven.blamejared.com'; content { includeGroup 'vazkii.patchouli' } } }
    def versions = [
        'fabric-1.20.1': 'Patchouli:1.20.1-85-FABRIC',
        'forge-1.20.1': 'Patchouli:1.20.1-85-FORGE',
        'fabric-1.21.1': 'Patchouli:1.21.1-93-FABRIC',
        'neoforge-1.21.1': 'Patchouli:1.21.1-93-NEOFORGE',
        'neoforge-26.1.2': 'patchouli-neoforge:26.1-94'
    ]
    // The standalone 26.1.2 project has a different root name from the root-build subproject.
    def target = project.name.endsWith('26.1.2') ? 'neoforge-26.1.2' : project.name
    dependencies.add(project.name.endsWith('26.1.2') ? 'localRuntime' : 'modLocalRuntime',
            "vazkii.patchouli:${versions[target]}")
}
