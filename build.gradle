plugins {
    id 'dev.architectury.loom' version '1.11-SNAPSHOT' apply false
    id 'architectury-plugin' version '3.4-SNAPSHOT'
    id 'com.gradleup.shadow' version '8.3.6' apply false
}

architectury {
    minecraft = rootProject.findProperty('minecraft_version')
}

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version

    repositories {
        mavenLocal()
        mavenCentral()
    }
}

def versionGroupFor(String projectName) {
    return gradle.ext.mcVersionMapping.get(projectName, rootProject.findProperty('minecraft_version'))
}

def depVersionsFor(String mcVer) {
    def prefix = mcVer.replace('.', '_')
    def versions = [:]
    versions.minecraft_version = rootProject.findProperty("minecraft_version_${prefix}")
    versions.architectury_api_version = rootProject.findProperty("architectury_version_${prefix}")
    versions.fabric_loader_version = rootProject.findProperty("fabric_loader_version_${prefix}")
    versions.fabric_api_version = rootProject.findProperty("fabric_api_version_${prefix}")
    versions.forge_version = rootProject.findProperty("forge_version_${prefix}")
    versions.neoforge_version = rootProject.findProperty("neoforge_version_${prefix}")
    versions.enabled_platforms = rootProject.findProperty("enabled_platforms_${prefix}")
    return versions
}

subprojects {
    if (project.name == 'neoforge-26.1.2') {
        return
    }

    apply plugin: 'dev.architectury.loom'
    apply plugin: 'architectury-plugin'
    apply plugin: 'maven-publish'

    def mcVer = versionGroupFor(":${project.name}")
    def deps = depVersionsFor(mcVer)

    project.ext.minecraft_version = deps.minecraft_version
    project.ext.architectury_api_version = deps.architectury_api_version
    project.ext.fabric_loader_version = deps.fabric_loader_version
    project.ext.fabric_api_version = deps.fabric_api_version
    project.ext.forge_version = deps.forge_version
    project.ext.neoforge_version = deps.neoforge_version
    project.ext.enabled_platforms = deps.enabled_platforms

    base {
        archivesName = "$rootProject.archives_name-$project.name"
    }

    repositories {
        maven { url 'https://jitpack.io' }
    }

    loom {
        silentMojangMappingsLicense()
    }

    dependencies {
        minecraft "net.minecraft:minecraft:${deps.minecraft_version}"
        mappings loom.officialMojangMappings()
        compileOnly "org.projectlombok:lombok:1.18.34"
        annotationProcessor "org.projectlombok:lombok:1.18.34"
    }

    java {
        withSourcesJar()
        def javaVersion = mcVer == '1.20.1' ? JavaVersion.VERSION_17 : JavaVersion.VERSION_21
        sourceCompatibility = javaVersion
        targetCompatibility = javaVersion
    }

    tasks.withType(JavaCompile).configureEach {
        def javaRelease = mcVer == '1.20.1' ? 17 : 21
        it.options.release = javaRelease
    }

    publishing {
        publications {
            mavenJava(MavenPublication) {
                artifactId = base.archivesName.get()
                from components.java
            }
        }

        repositories {
            // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
            // Notice: This block does NOT have the same function as the block in the top level.
            // The repositories here will be used for publishing your artifact, not for
            // retrieving dependencies.
        }
    }
}

tasks.register('testAllVersions') {
    group = 'verification'
    description = 'Runs shared and version-specific tests for every supported Minecraft version.'
    dependsOn ':common:test', ':common-1.20.1:test', ':common-1.21.1:test', ':neoforge-26.1.2:test'
}
