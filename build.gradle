plugins {
    id 'dev.architectury.loom' version '1.11-SNAPSHOT' apply false
    id 'architectury-plugin' version '3.4-SNAPSHOT'
    id 'com.gradleup.shadow' version '8.3.6' apply false
}

// Set default version-specific properties
rootProject.ext.minecraft_version = '1.21.1'
rootProject.ext.architectury_api_version = '13.0.8'
rootProject.ext.fabric_loader_version = '0.17.2'
rootProject.ext.fabric_api_version = '0.116.5+1.21.1'
rootProject.ext.neoforge_version = '21.1.201'
rootProject.ext.forge_version = '1.20.1-47.4.0'

architectury {
    minecraft = rootProject.ext.minecraft_version
}

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version

    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'dev.architectury.loom'
    apply plugin: 'architectury-plugin'
    apply plugin: 'maven-publish'

    base {
        // Set up a suffixed format for the mod jar names, e.g. `example-fabric`.
        archivesName = "$rootProject.archives_name-$project.name"
    }

    repositories {
        // Add repositories to retrieve artifacts from in here.
        // You should only use other mods because
        // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
        // See https://docs.gradle.org/current/userguide/declaring_repositories.html
        // for more information about repositories.
        maven { url 'https://jitpack.io' }
    }

    loom {
        silentMojangMappingsLicense()
    }

    dependencies {
        // Determine the Minecraft version based on project name
        def mcVersion = project.name.contains('1.20.1') ? '1.20.1' : 
                       (project.name.contains('1.21.1') ? '1.21.1' : rootProject.ext.minecraft_version)
        
        minecraft "net.minecraft:minecraft:$mcVersion"
        mappings loom.officialMojangMappings()
        compileOnly "org.projectlombok:lombok:1.18.34"
        annotationProcessor "org.projectlombok:lombok:1.18.34"

    }

    java {
        // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
        // if it is present.
        // If you remove this line, sources will not be generated.
        withSourcesJar()

        // Determine Java version based on project name
        def javaVersion = project.name.contains('1.21.1') ? JavaVersion.VERSION_21 : JavaVersion.VERSION_17
        sourceCompatibility = javaVersion
        targetCompatibility = javaVersion
    }

    tasks.withType(JavaCompile).configureEach {
        def javaRelease = project.name.contains('1.21.1') ? 21 : 17
        it.options.release = javaRelease
    }

    // Configure Maven publishing.
    publishing {
        publications {
            mavenJava(MavenPublication) {
                artifactId = base.archivesName.get()
                from components.java
            }
        }

        // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
        repositories {
            // Add repositories to publish to here.
            // Notice: This block does NOT have the same function as the block in the top level.
            // The repositories here will be used for publishing your artifact, not for
            // retrieving dependencies.
        }
    }
}
