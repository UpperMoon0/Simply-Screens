plugins { id 'net.fabricmc.fabric-loom-remap' version '1.17.9' }
apply from:'../gradle/legacy-port.gradle'
dependencies {
    minecraft 'com.mojang:minecraft:1.16.5'
    mappings loom.officialMojangMappings()
    modImplementation 'net.fabricmc:fabric-loader:0.19.5'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.42.0+1.16'
    modImplementation 'me.shedaniel:architectury-fabric:1.32.68'
    modImplementation files(portOpenuiJar)
    modRuntimeOnly files(portPacketweaveJar)
}
loom { mixin { useLegacyMixinAp = true; defaultRefmapName = "simplyscreens.refmap.json" } }
loom {
    runs {
        liveJoinTestClient {
            client(); runDir 'run/live-join/client'
            property 'simplyscreens.liveJoinTest','true'
            vmArgs '-Xmx1G'
            programArgs '--username','ScreensProbe','--server','127.0.0.1','--port','25575'
        }
        liveJoinTestServer { server(); runDir 'run/live-join/server'; vmArgs '-Xmx1G'; programArg 'nogui' }
    }
}
tasks.withType(JavaExec).configureEach { javaLauncher=javaToolchains.launcherFor { languageVersion=JavaLanguageVersion.of(8) } }
// The native runner already owns Xvfb. Loom 1.17's internal Xvfb command omits
// JavaExec's bare classpath on Java 8 (only Java 9+ argfiles carry it across).
// Keep the real Java 8 launcher and let JavaExec preserve the full classpath.
tasks.withType(net.fabricmc.loom.task.AbstractRunTask).configureEach { useXvfb.set(false) }
