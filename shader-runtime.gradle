// Opt-in development dependencies only. Production jars never bundle shader mods.
// First run python tools/shader_stack.py --target <target> --client <run directory>.
def stackDirectory = providers.gradleProperty('screensShaderStack')
if (stackDirectory.isPresent()) {
    def lock = new groovy.json.JsonSlurper().parse(rootProject.file('tools/shader/stack-lock.json'))
    def artifacts = lock.stacks[project.name]
    if (artifacts == null) throw new GradleException("No shader stack for ${project.name}")
    def jars = artifacts.collect { artifact ->
        def jar = new File(stackDirectory.get(), artifact.filename)
        if (!jar.isFile()) throw new GradleException("Missing shader dependency ${jar}; run shader_stack.py first")
        def digest = java.security.MessageDigest.getInstance('SHA-512').digest(jar.bytes).encodeHex().toString()
        if (digest != artifact.sha512) throw new GradleException("Shader dependency checksum mismatch: ${jar}")
        jar
    }
    // Loom strips jar-in-jar metadata while remapping dev mods. Expand children from
    // verified parent bytes; never edit third-party manifests or download loose libraries.
    def nestedMods = []
    def nestedLibraries = []
    if (!plugins.hasPlugin('net.neoforged.moddev')) {
        def selected = [:]
        // Explicit reviewed resolutions for the pinned parents' overlapping JarJar ranges.
        def compatibleVersions = [
            'org.sinytra.forgified-fabric-api:fabric-renderer-api-v1': ['3.4.0+9c40919e19', '3.4.0+acb05a3919'],
            'io.github.llamalad7:mixinextras-forge': ['0.3.5', '0.4.1'],
            'com.github.LlamaLad7:MixinExtras': ['0.3.5', '0.4.1']
        ]
        def expand
        expand = { File parent ->
            new java.util.zip.ZipFile(parent).withCloseable { zip ->
                def fabric = zip.getEntry('fabric.mod.json')
                def metadata = fabric ?: zip.getEntry('META-INF/jarjar/metadata.json')
                if (metadata == null) return
                def data = new groovy.json.JsonSlurper().parse(zip.getInputStream(metadata))
                (data.jars ?: []).each { entry ->
                    def path = entry.file ?: entry.path
                    def childEntry = zip.getEntry(path)
                    if (childEntry == null) throw new GradleException("Missing nested shader dependency ${path}")
                    def bytes = zip.getInputStream(childEntry).bytes
                    def digest = java.security.MessageDigest.getInstance('SHA-512').digest(bytes).encodeHex().toString()
                    def child = layout.buildDirectory.file("shader-nested/${digest}.jar").get().asFile
                    child.parentFile.mkdirs()
                    child.bytes = bytes
                    def id = entry.identifier ? "${entry.identifier.group}:${entry.identifier.artifact}".toString() : path
                    def version = entry.version?.artifactVersion
                    def nativeMod = false
                    new java.util.zip.ZipFile(child).withCloseable { nested ->
                        if (nested.getEntry('fabric.mod.json') != null) {
                            def manifest = new groovy.json.JsonSlurper().parse(nested.getInputStream(nested.getEntry('fabric.mod.json')))
                            id = manifest.id
                            version = manifest.version
                            nativeMod = true
                        } else nativeMod = nested.getEntry('META-INF/mods.toml') != null || nested.getEntry('META-INF/neoforge.mods.toml') != null
                    }
                    // The Fabric API dependency already supplies these components.
                    if (project.name.startsWith('fabric-') && id.startsWith('fabric-')) return
                    if (selected.containsKey(id)) {
                        def old = selected[id]
                        if (old.version == version) return
                        def accepted = compatibleVersions[id]
                        if (accepted == null || !accepted.contains(old.version) || !accepted.contains(version))
                            throw new GradleException("Conflicting nested shader dependency ${id}: ${old.version} / ${version}")
                        if (accepted.indexOf(version) < accepted.indexOf(old.version)) return
                        nestedMods.remove(old.file)
                        nestedLibraries.remove(old.file)
                    }
                    selected[id] = [version:version, file:child]
                    (nativeMod ? nestedMods : nestedLibraries).add(child)
                    expand(child)
                }
            }
        }
        jars.each { expand(it) }
    }
    if (project.name == 'fabric-1.20.1') {
        // Sodium 0.5 requires Minecraft's LWJGL 3.3.1. Run the game on Java17,
        // not Gradle's Java21, so Loom does not substitute LWJGL3.3.2-snapshot.
        project.ext.set('fabric.loom.runtimeJavaCompatibilityVersion', '17')
        tasks.withType(JavaExec).configureEach {
            javaLauncher.set(javaToolchains.launcherFor { languageVersion.set(JavaLanguageVersion.of(17)) })
        }
    }
    dependencies {
        if (plugins.hasPlugin('net.neoforged.moddev')) localRuntime files(jars)
        else {
            modLocalRuntime files(jars + nestedMods)
            if (project.name.startsWith('fabric-')) localRuntime files(nestedLibraries)
            else forgeRuntimeLibrary files(nestedLibraries) // FML bootstrap discovery requires this classpath.
        }
    }
}
