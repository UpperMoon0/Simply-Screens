pluginManagement {
    repositories {
        maven { url "https://maven.fabricmc.net/" }
        maven { url "https://maven.architectury.dev/" }
        maven { url "https://files.minecraftforge.net/maven/" }
        gradlePluginPortal()
    }
}

rootProject.name = 'simply_screens'

// Shared common module (version-independent)
include 'common'

// 1.20.1 modules (Forge)
include 'common-1.20.1'
include 'fabric-1.20.1'
include 'forge-1.20.1'

// 1.21.1 modules (NeoForge)
include 'common-1.21.1'
include 'fabric-1.21.1'
include 'neoforge-1.21.1'

// 26.1.2 module (NeoForge, standalone ModDevGradle project)
include 'neoforge-26.1.2'

// Explicit mapping from project name to MC version group.
// This is the single place to update when adding/removing version support.
gradle.ext.mcVersionMapping = [
    ':common': (settings.hasProperty('minecraft_version') ? settings.minecraft_version : '1.21.1'),
    ':common-1.20.1': '1.20.1',
    ':fabric-1.20.1': '1.20.1',
    ':forge-1.20.1': '1.20.1',
    ':common-1.21.1': '1.21.1',
    ':fabric-1.21.1': '1.21.1',
    ':neoforge-1.21.1': '1.21.1',
    ':neoforge-26.1.2': '26.1.2',
]
